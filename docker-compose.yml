version: '3.8'

services:
  # ====================================================================
  # FastAPI Backend (AI Search, FAISS, Document Processing, Knowledge Graph)
  # ====================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: personal_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-personal-knowledge-assistant-change-in-prod}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MAX_UPLOAD_SIZE_MB=50
    volumes:
      - ./backend/data:/app/data
    networks:
      - app_network

  # ====================================================================
  # React Frontend (Nginx SPA + Reverse Proxy)
  # ====================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: personal_ai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
